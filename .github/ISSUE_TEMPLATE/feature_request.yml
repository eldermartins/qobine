name: Feature request
description: Propose an improvement aligned with the GNOME-focused fork
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The immediate priority is a stable, maintainable GNOME client. Proposals that delay the current stabilization milestone may be deferred.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired behavior and how it fits GNOME patterns.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention existing workarounds or alternative approaches.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GNOME interface or navigation
        - Search or library
        - Playback or queue
        - Authentication or session
        - MPRIS or desktop integration
        - Packaging or documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This request concerns the fork and is not an upstream-only request.
          required: true
        - label: I searched existing issues and did not find the same proposal.
          required: true
